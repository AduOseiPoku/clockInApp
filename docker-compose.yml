services:
  db:
    image: postgres:16-alpine
    container_name: clockin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_clockin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_clockin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: clockin_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_SQLITE=False
      - DB_NAME=school_clockin_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-school-clockin-2026
      - CURRENCY_SYMBOL=GH₵
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
